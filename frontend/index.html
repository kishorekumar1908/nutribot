<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriBot – AI Diet Chatbot</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design Tokens ───────────────────────────────────────────────────── */
    :root[data-theme="light"] {
      --bg:          #f4f6f0;
      --surface:     #ffffff;
      --header:      #2d6a4f;
      --header-text: #ffffff;
      --accent:      #2d6a4f;
      --accent-dim:  #40916c;
      --accent-lt:   #d8f3dc;
      --user-bg:     #2d6a4f;
      --user-text:   #ffffff;
      --bot-bg:      #f0faf4;
      --bot-border:  #b7e4c7;
      --text:        #1a1a1a;
      --muted:       #6b7280;
      --border:      #e5e7eb;
      --chip-bg:     #e9f5ee;
      --chip-text:   #1b4332;
      --modal-bg:    rgba(0,0,0,0.45);
      --card-bg:     #ffffff;
      --radius:      16px;
      --shadow:      0 8px 32px rgba(0,0,0,0.10);
      --tag-fat:     #fee2e2; --tag-fat-t:   #991b1b;
      --tag-muscle:  #dbeafe; --tag-muscle-t:#1e40af;
      --tag-maint:   #fef9c3; --tag-maint-t: #713f12;
    }

    :root[data-theme="dark"] {
      --bg:          #0f1a14;
      --surface:     #1a2b20;
      --header:      #1b4332;
      --header-text: #d8f3dc;
      --accent:      #52b788;
      --accent-dim:  #74c69d;
      --accent-lt:   #1b4332;
      --user-bg:     #1b4332;
      --user-text:   #d8f3dc;
      --bot-bg:      #1f2e24;
      --bot-border:  #2d6a4f;
      --text:        #e8f5ec;
      --muted:       #86efac;
      --border:      #2d3b30;
      --chip-bg:     #1b3a27;
      --chip-text:   #86efac;
      --modal-bg:    rgba(0,0,0,0.70);
      --card-bg:     #1f2e24;
      --radius:      16px;
      --shadow:      0 8px 32px rgba(0,0,0,0.40);
      --tag-fat:     #450a0a; --tag-fat-t:   #fca5a5;
      --tag-muscle:  #1e3a5f; --tag-muscle-t:#93c5fd;
      --tag-maint:   #422006; --tag-maint-t: #fde68a;
    }

    /* ── Layout ──────────────────────────────────────────────────────────── */
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background .3s;
    }

    #chatbox {
      width: 440px;
      max-width: 100%;
      height: 680px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background .3s;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    #chat-header {
      background: var(--header);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .header-icon {
      width: 38px; height: 38px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    #chat-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem; color: var(--header-text); font-weight: 700;
    }
    #chat-header p {
      font-size: 0.68rem; color: rgba(255,255,255,0.70); margin-top: 1px;
    }
    .header-actions { margin-left: auto; display: flex; gap: 8px; }
    .icon-btn {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.12);
      border: none; border-radius: 8px;
      cursor: pointer; color: #fff; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.25); }

    /* ── Toolbar ─────────────────────────────────────────────────────────── */
    #toolbar {
      display: flex; gap: 8px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .tool-btn {
      font-family: inherit; font-size: 0.75rem; font-weight: 500;
      padding: 5px 11px;
      border: 1.5px solid var(--bot-border);
      border-radius: 20px;
      background: var(--chip-bg);
      color: var(--chip-text);
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: background .2s, border-color .2s;
    }
    .tool-btn:hover { background: var(--accent-lt); border-color: var(--accent); }

    /* ── Messages ────────────────────────────────────────────────────────── */
    #messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--bot-border); border-radius: 4px; }

    .bubble-row { display: flex; align-items: flex-end; gap: 8px; }
    .bubble-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0;
    }
    .user .avatar { background: var(--user-bg); }
    .bot  .avatar { background: var(--accent-lt); }

    .bubble {
      max-width: 80%;
      padding: 10px 13px;
      border-radius: 14px;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .user .bubble {
      background: var(--user-bg); color: var(--user-text);
      border-bottom-right-radius: 3px;
    }
    .bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--bot-border);
      color: var(--text);
      border-bottom-left-radius: 3px;
    }
    .bot .bubble em { font-style: italic; color: var(--muted); }
    .bot .bubble b  { font-weight: 600; }

    /* ── Quick-reply chips ───────────────────────────────────────────────── */
    #chips-container {
      padding: 0 14px 8px;
      display: flex; flex-wrap: wrap; gap: 6px;
      flex-shrink: 0;
    }
    .chip {
      font-family: inherit; font-size: 0.74rem; font-weight: 500;
      padding: 5px 12px;
      border: 1.5px solid var(--bot-border);
      border-radius: 20px;
      background: var(--chip-bg);
      color: var(--chip-text);
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .chip:hover { background: var(--accent-lt); border-color: var(--accent); }
    .chip:active { transform: scale(0.96); }

    /* ── Input ───────────────────────────────────────────────────────────── */
    #inputBox {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    #input {
      flex: 1; padding: 9px 14px;
      border: 1.5px solid var(--bot-border);
      border-radius: 24px;
      font-family: inherit; font-size: 0.85rem;
      background: var(--bg); color: var(--text);
      outline: none; transition: border-color .2s, background .2s;
    }
    #input:focus { border-color: var(--accent); background: var(--surface); }
    #input::placeholder { color: var(--muted); }
    #sendBtn {
      width: 38px; height: 38px;
      background: var(--accent);
      border: none; border-radius: 50%;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .1s;
    }
    #sendBtn:hover { background: var(--accent-dim); }
    #sendBtn:active { transform: scale(0.92); }
    #sendBtn svg { fill: white; }

    /* ── Typing indicator ────────────────────────────────────────────────── */
    .typing-bubble { display: flex; gap: 4px; align-items: center; padding: 11px 14px; }
    .typing-bubble span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted); animation: bounce 1.2s infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: .2s; }
    .typing-bubble span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── Card: Goal badge ────────────────────────────────────────────────── */
    .goal-badge {
      display: inline-block;
      font-size: 0.68rem; font-weight: 600;
      padding: 2px 9px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: .05em;
      width: fit-content; margin-bottom: 4px;
    }
    .goal-badge.fat_loss    { background: var(--tag-fat);    color: var(--tag-fat-t); }
    .goal-badge.muscle_gain { background: var(--tag-muscle); color: var(--tag-muscle-t); }
    .goal-badge.maintenance { background: var(--tag-maint);  color: var(--tag-maint-t); }

    /* ── Card: Diet Plan ─────────────────────────────────────────────────── */
    .diet-card { display: flex; flex-direction: column; gap: 9px; }
    .calories-row { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    .calories-row span { font-size: 0.78rem; font-weight: 400; color: var(--muted); }
    .meta-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 2px; }
    .meta-pill {
      font-size: 0.70rem; font-weight: 500;
      padding: 2px 8px; border-radius: 10px;
      background: var(--accent-lt); color: var(--accent);
    }
    .macros { display: flex; gap: 6px; flex-wrap: wrap; }
    .macro-pill {
      background: var(--card-bg);
      border: 1.5px solid var(--bot-border);
      border-radius: 9px; padding: 5px 10px;
      font-size: 0.75rem; font-weight: 500; color: var(--text);
      display: flex; flex-direction: column; align-items: center; min-width: 55px;
    }
    .macro-pill .macro-label { font-size: 0.62rem; color: var(--muted); margin-bottom: 1px; }
    .macro-pill .macro-val   { font-weight: 700; color: var(--accent); font-size: 0.82rem; }
    .divider { height: 1px; background: var(--border); }
    .meal-section h4 {
      font-size: 0.68rem; text-transform: uppercase;
      letter-spacing: .07em; color: var(--muted); margin-bottom: 6px;
    }
    .meal-item { display: flex; align-items: flex-start; gap: 7px; font-size: 0.80rem; padding: 3px 0; }
    .meal-dot  { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 5px; }
    .tdee-note { font-size: 0.72rem; color: var(--muted); font-style: italic; }

    /* ── Card: BMI ───────────────────────────────────────────────────────── */
    .bmi-card { display: flex; flex-direction: column; gap: 8px; }
    .bmi-value { font-size: 2rem; font-weight: 700; color: var(--accent); line-height: 1; }
    .bmi-category { font-size: 0.80rem; font-weight: 600; color: var(--text); }
    .bmi-gauge {
      position: relative; height: 14px;
      border-radius: 7px; overflow: hidden;
      background: linear-gradient(to right,
        #3b82f6 0% 22%,
        #22c55e 22% 48%,
        #f59e0b 48% 72%,
        #ef4444 72% 100%);
      margin: 4px 0;
    }
    .bmi-marker {
      position: absolute; top: -2px;
      width: 18px; height: 18px;
      background: var(--surface);
      border: 2.5px solid var(--text);
      border-radius: 50%;
      transform: translateX(-50%);
      transition: left .5s ease;
    }
    .bmi-labels { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--muted); }
    .info-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .info-item  { background: var(--bot-bg); border-radius: 8px; padding: 7px 10px; }
    .info-item .lbl { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .info-item .val { font-weight: 700; font-size: 0.88rem; color: var(--accent); margin-top: 1px; }

    /* ── Card: Water ─────────────────────────────────────────────────────── */
    .water-card { display: flex; flex-direction: column; gap: 8px; }
    .water-main { display: flex; align-items: baseline; gap: 6px; }
    .water-litres { font-size: 2rem; font-weight: 700; color: #3b82f6; line-height: 1; }
    .water-unit   { font-size: 0.80rem; color: var(--muted); }
    .water-glasses-label { font-size: 0.75rem; color: var(--muted); }
    .water-glasses { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
    .glass-icon { font-size: 1.15rem; }
    .water-bar-wrap { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; }
    .water-bar { height: 100%; border-radius: 4px; background: #3b82f6; width: 0; transition: width .8s ease; }
    .water-tip { font-size: 0.72rem; color: var(--muted); font-style: italic; }

    /* ── Card: Snacks ────────────────────────────────────────────────────── */
    .snacks-card { display: flex; flex-direction: column; gap: 7px; }
    .snack-item {
      display: flex; align-items: center; gap: 8px;
      background: var(--bot-bg);
      border: 1px solid var(--bot-border);
      border-radius: 9px; padding: 7px 10px;
      font-size: 0.80rem;
    }
    .snack-icon { font-size: 1rem; flex-shrink: 0; }

    /* ── Card: Tips ──────────────────────────────────────────────────────── */
    .tips-card { display: flex; flex-direction: column; gap: 6px; }
    .tip-item {
      background: var(--bot-bg);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 7px 10px;
      font-size: 0.80rem; line-height: 1.5;
    }

    /* ── Card: Calories ──────────────────────────────────────────────────── */
    .cal-card { display: flex; flex-direction: column; gap: 8px; }
    .cal-big  { font-size: 2rem; font-weight: 700; color: var(--accent); line-height: 1; }
    .cal-sub  { font-size: 0.75rem; color: var(--muted); }
    .cal-row  { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; }
    .cal-row:last-child { border: none; }
    .cal-row .lbl { color: var(--muted); }
    .cal-row .val { font-weight: 700; color: var(--accent); }

    /* ── Card: Protein ───────────────────────────────────────────────────── */
    .protein-card { display: flex; flex-direction: column; gap: 8px; }
    .protein-big  { font-size: 2rem; font-weight: 700; color: #8b5cf6; line-height: 1; }
    .protein-sub  { font-size: 0.75rem; color: var(--muted); }
    .protein-sources { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
    .protein-source {
      font-size: 0.73rem; padding: 3px 9px; border-radius: 10px;
      background: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff;
    }
    :root[data-theme="dark"] .protein-source { background: #2e1065; color: #c4b5fd; border-color: #4c1d95; }
    .protein-tip { font-size: 0.72rem; color: var(--muted); font-style: italic; }

    /* ── Export button (inside diet card) ───────────────────────────────── */
    .export-btn {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: inherit; font-size: 0.73rem; font-weight: 500;
      padding: 5px 11px; border-radius: 8px;
      background: transparent; color: var(--accent);
      border: 1.5px solid var(--accent);
      cursor: pointer; margin-top: 2px;
      transition: background .15s;
      width: fit-content;
    }
    .export-btn:hover { background: var(--accent-lt); }

    /* ── Weekly Plan Modal ───────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: var(--modal-bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal-box {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%; max-width: 560px;
      max-height: 85vh; overflow-y: auto;
      padding: 22px 22px 18px;
      transform: translateY(20px);
      transition: transform .25s;
    }
    .modal-overlay.open .modal-box { transform: translateY(0); }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem; color: var(--text);
    }
    .modal-close {
      background: none; border: none;
      font-size: 1.3rem; cursor: pointer; color: var(--muted);
      line-height: 1; padding: 2px 6px; border-radius: 6px;
    }
    .modal-close:hover { background: var(--border); }
    .week-day { margin-bottom: 14px; }
    .week-day h3 {
      font-size: 0.78rem; font-weight: 700;
      color: var(--accent); text-transform: uppercase;
      letter-spacing: .06em; margin-bottom: 7px;
      padding-bottom: 4px; border-bottom: 1.5px solid var(--bot-border);
    }
    .week-meal { display: flex; gap: 8px; font-size: 0.80rem; padding: 3px 0; }
    .week-meal .slot { min-width: 65px; color: var(--muted); font-weight: 500; }
    .modal-footer { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    .modal-btn {
      font-family: inherit; font-size: 0.80rem; font-weight: 500;
      padding: 7px 14px; border-radius: 9px; cursor: pointer;
      transition: background .15s;
    }
    .modal-btn.primary { background: var(--accent); color: #fff; border: none; }
    .modal-btn.primary:hover { background: var(--accent-dim); }
    .modal-btn.secondary { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
    .modal-btn.secondary:hover { background: var(--accent-lt); }
    #weekly-loading { text-align: center; padding: 30px; color: var(--muted); font-size: 0.88rem; }
  </style>
</head>
<body>

<!-- ── Chatbox ──────────────────────────────────────────────────────────── -->
<div id="chatbox">

  <div id="chat-header">
    <div class="header-icon">🥗</div>
    <div>
      <h1>NutriBot</h1>
      <p>AI-powered nutrition assistant</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="darkToggle" title="Toggle dark mode" onclick="toggleDark()">🌙</button>
      <button class="icon-btn" id="clearBtn"   title="Clear chat"       onclick="clearChat()">🗑️</button>
    </div>
  </div>

  <div id="toolbar">
    <button class="tool-btn" onclick="fetchWeeklyPlan()">📅 Weekly Plan</button>
    <button class="tool-btn" onclick="quickSend('Check my BMI')">📊 BMI Check</button>
    <button class="tool-btn" onclick="quickSend('Healthy snack ideas')">🥜 Snacks</button>
    <button class="tool-btn" onclick="quickSend('Diet tips')">💡 Tips</button>
  </div>

  <div id="messages">
    <!-- Welcome bubble injected by JS -->
  </div>

  <div id="chips-container"></div>

  <div id="inputBox">
    <input
      id="input"
      type="text"
      placeholder='e.g. "75kg 170cm 25M fat loss veg plan"'
      autocomplete="off"
    />
    <button id="sendBtn" onclick="sendMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
</div>

<!-- ── Weekly Plan Modal ─────────────────────────────────────────────────── -->
<div class="modal-overlay" id="weeklyModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2>📅 Weekly Meal Plan</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="weekly-content">
      <div id="weekly-loading">Loading your meal plan…</div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn secondary" onclick="closeModal()">Close</button>
      <button class="modal-btn primary"   onclick="exportWeeklyPlan()">📥 Export Plan</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════════
const API = "http://127.0.0.1:8000";

// Generate a simple UUID for session persistence
function genUUID() {
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
let SESSION_ID = genUUID();
let lastWeeklyData = null;
let lastDietPlanData = null;

// ═══════════════════════════════════════════════════════════════════════════════
// DARK MODE
// ═══════════════════════════════════════════════════════════════════════════════
let darkMode = false;

function toggleDark() {
  darkMode = !darkMode;
  document.documentElement.setAttribute("data-theme", darkMode ? "dark" : "light");
  document.getElementById("darkToggle").textContent = darkMode ? "☀️" : "🌙";
}

// ═══════════════════════════════════════════════════════════════════════════════
// CHIPS
// ═══════════════════════════════════════════════════════════════════════════════
const CHIPS = {
  greeting:    ["Fat Loss Plan 🔥", "Muscle Gain Plan 💪", "Check my BMI 📊", "How much water? 💧"],
  diet_plan:   ["📅 Weekly Plan", "💡 Diet Tips", "🥜 Snack Ideas", "🥩 Protein Intake"],
  fat_loss:    ["📅 Weekly Plan", "💡 Fat Loss Tips", "💧 Water Intake", "🥜 Snacks"],
  muscle_gain: ["📅 Weekly Plan", "💡 Muscle Tips", "🥩 Protein Intake", "💧 Water Intake"],
  bmi:         ["🥗 Get Diet Plan", "🔥 Calorie Target", "💡 Diet Tips"],
  water:       ["💡 Diet Tips", "🥜 Snacks", "🥗 Diet Plan"],
  snacks:      ["🥗 Diet Plan", "💡 Diet Tips", "💧 Water Intake"],
  tips:        ["🥗 Diet Plan", "🥜 Snacks", "📊 BMI Check"],
  calories:    ["🥗 Diet Plan", "🥩 Protein Intake", "💡 Diet Tips"],
  protein:     ["🥗 Diet Plan", "🔥 Calorie Target", "💡 Diet Tips"],
};

const CHIP_TO_MSG = {
  "Fat Loss Plan 🔥":   "I want to lose fat, give me a meal plan",
  "Muscle Gain Plan 💪":"I want to gain muscle, give me a diet plan",
  "Check my BMI 📊":    "Check my BMI",
  "How much water? 💧": "How much water should I drink?",
  "📅 Weekly Plan":     "__weekly__",
  "💡 Diet Tips":       "Give me diet tips",
  "💡 Fat Loss Tips":   "Diet tips for fat loss",
  "💡 Muscle Tips":     "Diet tips for muscle gain",
  "🥜 Snack Ideas":     "Healthy snack ideas",
  "🥜 Snacks":          "Healthy snack ideas",
  "🥩 Protein Intake":  "How much protein do I need?",
  "💧 Water Intake":    "How much water should I drink?",
  "🥗 Get Diet Plan":   "Give me a diet plan",
  "🥗 Diet Plan":       "Give me a diet plan",
  "🔥 Calorie Target":  "What is my calorie target?",
  "📊 BMI Check":       "Check my BMI",
};

function showChips(type) {
  const container = document.getElementById("chips-container");
  container.innerHTML = "";
  const list = CHIPS[type] || [];
  list.forEach(label => {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.textContent = label;
    btn.onclick = () => handleChip(label);
    container.appendChild(btn);
  });
}

function clearChips() {
  document.getElementById("chips-container").innerHTML = "";
}

function handleChip(label) {
  const msg = CHIP_TO_MSG[label];
  if (msg === "__weekly__") { fetchWeeklyPlan(); return; }
  if (msg) quickSend(msg);
}

function quickSend(text) {
  document.getElementById("input").value = text;
  sendMessage();
}

// ═══════════════════════════════════════════════════════════════════════════════
// BUBBLE HELPERS
// ═══════════════════════════════════════════════════════════════════════════════
function addBubble(side, html) {
  const msgs = document.getElementById("messages");
  const row = document.createElement("div");
  row.className = `bubble-row ${side}`;
  row.innerHTML = `
    <div class="avatar">${side === "user" ? "🧑" : "🤖"}</div>
    <div class="bubble">${html}</div>
  `;
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return row;
}

function showTyping() {
  const msgs = document.getElementById("messages");
  const row = document.createElement("div");
  row.className = "bubble-row bot"; row.id = "typing-ind";
  row.innerHTML = `<div class="avatar">🤖</div>
    <div class="bubble"><div class="typing-bubble"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}
function removeTyping() {
  const el = document.getElementById("typing-ind");
  if (el) el.remove();
}

function clearChat() {
  document.getElementById("messages").innerHTML = "";
  clearChips();
  SESSION_ID = genUUID();
  lastDietPlanData = null;
  injectWelcome();
}

// ═══════════════════════════════════════════════════════════════════════════════
// CARD RENDERERS
// ═══════════════════════════════════════════════════════════════════════════════
function goalLabel(g) {
  return { fat_loss: "Fat Loss 🔥", muscle_gain: "Muscle Gain 💪", maintenance: "Maintenance ⚖️" }[g] || g || "General";
}
function goalClass(g) {
  return g === "fat_loss" ? "fat_loss" : g === "muscle_gain" ? "muscle_gain" : "maintenance";
}
function actLabel(a) {
  return { sedentary:"Sedentary", light:"Light", moderate:"Moderate", active:"Active", very_active:"Very Active" }[a] || a;
}

// Diet Plan card
function renderDietPlan(d) {
  lastDietPlanData = d;
  const dietLabel = d.diet_type === "non_veg" ? "Non-Veg 🍗" : "Veg 🥦";
  return `
  <div class="diet-card">
    <div><span class="goal-badge ${goalClass(d.goal)}">${goalLabel(d.goal)}</span></div>
    <div class="calories-row">${d.calories} kcal <span>/ day target</span></div>
    <div class="meta-pills">
      <span class="meta-pill">${d.weight} kg</span>
      <span class="meta-pill">${d.height} cm</span>
      <span class="meta-pill">${d.gender === "female" ? "Female" : "Male"}, ${d.age} yrs</span>
      <span class="meta-pill">${actLabel(d.activity)}</span>
      <span class="meta-pill">${dietLabel}</span>
    </div>
    <div class="macros">
      <div class="macro-pill"><div class="macro-label">Protein</div><div class="macro-val">${d.macros.protein}g</div></div>
      <div class="macro-pill"><div class="macro-label">Carbs</div><div class="macro-val">${d.macros.carbs}g</div></div>
      <div class="macro-pill"><div class="macro-label">Fat</div><div class="macro-val">${d.macros.fat}g</div></div>
    </div>
    <div class="divider"></div>
    <div class="meal-section">
      <h4>Today's Meals</h4>
      <div class="meal-item"><div class="meal-dot"></div><div>🌅 <b>Breakfast:</b> ${d.meal_plan.breakfast}</div></div>
      <div class="meal-item"><div class="meal-dot"></div><div>☀️ <b>Lunch:</b> ${d.meal_plan.lunch}</div></div>
      <div class="meal-item"><div class="meal-dot"></div><div>🍎 <b>Snacks:</b> ${d.meal_plan.snacks}</div></div>
      <div class="meal-item"><div class="meal-dot"></div><div>🌙 <b>Dinner:</b> ${d.meal_plan.dinner}</div></div>
    </div>
    <div class="tdee-note">TDEE: ${d.tdee} kcal/day (maintenance)</div>
    <button class="export-btn" onclick="exportDietPlan()">📥 Export this plan</button>
  </div>`;
}

// BMI card
function renderBmi(d) {
  // BMI range: 10–40+ mapped to 0–100%
  const pct = Math.min(100, Math.max(0, ((d.bmi - 10) / 30) * 100));
  const emoji = d.category === "Normal weight" ? "✅" : d.category === "Underweight" ? "⬇️" : d.category === "Overweight" ? "⚠️" : "🔴";
  return `
  <div class="bmi-card">
    <div>
      <div class="bmi-value">${d.bmi}</div>
      <div class="bmi-category">${emoji} ${d.category}</div>
    </div>
    <div class="bmi-gauge"><div class="bmi-marker" style="left:${pct}%"></div></div>
    <div class="bmi-labels"><span>Underweight<br/>&lt;18.5</span><span>Normal<br/>18.5–25</span><span>Overweight<br/>25–30</span><span>Obese<br/>&gt;30</span></div>
    <div class="info-grid">
      <div class="info-item"><div class="lbl">Weight</div><div class="val">${d.weight} kg</div></div>
      <div class="info-item"><div class="lbl">Height</div><div class="val">${d.height} cm</div></div>
    </div>
  </div>`;
}

// Water card
function renderWater(d) {
  const glasses = d.glasses;
  const pct = Math.min(100, Math.round((d.litres / 4) * 100));
  let glassHTML = "";
  for (let i = 0; i < Math.min(glasses, 12); i++) glassHTML += `<span class="glass-icon">🥤</span>`;
  if (glasses > 12) glassHTML += `<span style="font-size:.75rem;color:var(--muted)"> +${glasses-12} more</span>`;
  return `
  <div class="water-card">
    <div class="water-main">
      <div class="water-litres">${d.litres}L</div>
      <div class="water-unit">per day</div>
    </div>
    <div class="water-bar-wrap"><div class="water-bar" id="wBar" style="width:0"></div></div>
    <div class="water-glasses-label">${glasses} glasses of water (250 ml each)</div>
    <div class="water-glasses">${glassHTML}</div>
    <div class="water-tip">Tip: Drink a glass of water first thing in the morning and before each meal.</div>
  </div>`;
}

// Animate water bar after render
function animateWaterBar() {
  const bar = document.getElementById("wBar");
  if (bar) {
    const target = bar.style.width;
    bar.style.width = "0";
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = "width .9s ease"; bar.style.width = target; }));
  }
}

// Snacks card
function renderSnacks(d) {
  const icons = ["🥜", "🍎", "🥚", "🍌", "🧆", "🥛", "🌰"];
  return `
  <div class="snacks-card">
    <div style="font-size:.73rem;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em">
      Healthy Snack Ideas · ${d.diet_type === "non_veg" ? "Non-Veg" : "Veg"}
    </div>
    ${d.snacks.map((s, i) => `
      <div class="snack-item">
        <span class="snack-icon">${icons[i % icons.length]}</span>
        <span>${s}</span>
      </div>`).join("")}
  </div>`;
}

// Tips card
function renderTips(d) {
  return `
  <div class="tips-card">
    <div style="font-size:.73rem;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em">
      ${goalLabel(d.goal)} Tips
    </div>
    ${d.tips.map(t => `<div class="tip-item">${t}</div>`).join("")}
  </div>`;
}

// Calories card
function renderCalories(d) {
  const diff = d.calories - d.tdee;
  const diffLabel = diff === 0 ? "Maintenance" : diff > 0 ? `+${diff} surplus` : `${diff} deficit`;
  return `
  <div class="cal-card">
    <div>
      <div class="cal-big">${d.calories} kcal</div>
      <div class="cal-sub">Daily calorie target — ${goalLabel(d.goal)}</div>
    </div>
    <div class="divider"></div>
    <div class="cal-row"><span class="lbl">Maintenance (TDEE)</span><span class="val">${d.tdee} kcal</span></div>
    <div class="cal-row"><span class="lbl">Adjustment</span><span class="val">${diffLabel}</span></div>
    <div class="cal-row"><span class="lbl">Your Target</span><span class="val">${d.calories} kcal</span></div>
  </div>`;
}

// Protein card
function renderProtein(d) {
  const sources = ["Chicken", "Eggs", "Paneer", "Whey", "Lentils", "Tofu", "Fish"];
  return `
  <div class="protein-card">
    <div>
      <div class="protein-big">${d.protein}g</div>
      <div class="protein-sub">Protein per day (~2 g per kg body weight)</div>
    </div>
    <div class="protein-sources">
      ${sources.map(s => `<span class="protein-source">${s}</span>`).join("")}
    </div>
    <div class="protein-tip">${d.tip}</div>
  </div>`;
}

// Plain text (greeting, goodbye, fallback)
function renderText(d) {
  return d.message
    .replace(/\n/g, "<br>")
    .replace(/\*(.*?)\*/g, "<em>$1</em>")
    .replace(/•/g, "•");
}

// Route to correct renderer
function renderCard(data) {
  switch (data.type) {
    case "diet_plan":  return renderDietPlan(data);
    case "bmi":        return renderBmi(data);
    case "water":      return renderWater(data);
    case "snacks":     return renderSnacks(data);
    case "tips":       return renderTips(data);
    case "calories":   return renderCalories(data);
    case "protein":    return renderProtein(data);
    default:           return renderText(data);
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// SEND MESSAGE
// ═══════════════════════════════════════════════════════════════════════════════
async function sendMessage() {
  const inp = document.getElementById("input");
  const message = inp.value.trim();
  if (!message) return;

  addBubble("user", message);
  inp.value = "";
  clearChips();
  showTyping();

  try {
    const res  = await fetch(`${API}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, session_id: SESSION_ID }),
    });
    const data = await res.json();
    SESSION_ID = data.session_id || SESSION_ID;

    removeTyping();
    addBubble("bot", renderCard(data));

    // Animate water bar after DOM is updated
    if (data.type === "water") {
      const pct = Math.min(100, Math.round((data.litres / 4) * 100));
      const bar = document.getElementById("wBar");
      if (bar) {
        bar.style.width = pct + "%";
        // re-trigger animation
        bar.style.transition = "none";
        bar.style.width = "0";
        requestAnimationFrame(() => requestAnimationFrame(() => {
          bar.style.transition = "width .9s ease";
          bar.style.width = pct + "%";
        }));
      }
    }

    showChips(data.type === "text" && data.message && data.message.includes("NutriBot") ? "greeting" : data.type);

  } catch (err) {
    removeTyping();
    addBubble("bot", `❌ Cannot connect to the server.<br><em>Make sure the API is running: <code>uvicorn diet_chatbot:app --reload</code></em>`);
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// WEEKLY PLAN
// ═══════════════════════════════════════════════════════════════════════════════
async function fetchWeeklyPlan() {
  openModal();
  document.getElementById("weekly-content").innerHTML = `<div id="weekly-loading">Generating your weekly plan… 🥗</div>`;
  try {
    const res  = await fetch(`${API}/weekly-plan`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: "weekly plan", session_id: SESSION_ID }),
    });
    const data = await res.json();
    SESSION_ID     = data.session_id || SESSION_ID;
    lastWeeklyData = data;
    renderWeeklyInModal(data);
  } catch (e) {
    document.getElementById("weekly-content").innerHTML =
      `<p style="color:var(--muted);font-size:.85rem;">❌ Could not reach the server. Is the API running?</p>`;
  }
}

function renderWeeklyInModal(data) {
  const days = Object.keys(data.plan);
  const slotIcons = { breakfast:"🌅", lunch:"☀️", snacks:"🍎", dinner:"🌙" };
  const html = days.map(day => `
    <div class="week-day">
      <h3>${day}</h3>
      ${Object.entries(data.plan[day]).map(([slot, meal]) => `
        <div class="week-meal">
          <span class="slot">${slotIcons[slot] || ""} ${slot.charAt(0).toUpperCase()+slot.slice(1)}</span>
          <span>${meal}</span>
        </div>`).join("")}
    </div>
  `).join("");
  document.getElementById("weekly-content").innerHTML = html;
}

function openModal()  { document.getElementById("weeklyModal").classList.add("open"); }
function closeModal() { document.getElementById("weeklyModal").classList.remove("open"); }

// Close modal on backdrop click
document.getElementById("weeklyModal").addEventListener("click", function(e) {
  if (e.target === this) closeModal();
});

// ═══════════════════════════════════════════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════════════════════════════════════════
function exportWeeklyPlan() {
  if (!lastWeeklyData) return;
  let text = "NutriBot – Weekly Meal Plan\n";
  text += "Diet type: " + (lastWeeklyData.diet_type === "non_veg" ? "Non-Veg" : "Veg") + "\n";
  text += "=".repeat(40) + "\n\n";
  for (const [day, meals] of Object.entries(lastWeeklyData.plan)) {
    text += `${day.toUpperCase()}\n`;
    for (const [slot, meal] of Object.entries(meals)) {
      text += `  ${slot.charAt(0).toUpperCase()+slot.slice(1).padEnd(9)}: ${meal}\n`;
    }
    text += "\n";
  }
  downloadText("NutriBot_Weekly_Plan.txt", text);
}

function exportDietPlan() {
  if (!lastDietPlanData) return;
  const d = lastDietPlanData;
  let text = "NutriBot – Daily Diet Plan\n";
  text += "=".repeat(40) + "\n\n";
  text += `Goal       : ${goalLabel(d.goal)}\n`;
  text += `Calories   : ${d.calories} kcal/day\n`;
  text += `TDEE       : ${d.tdee} kcal/day (maintenance)\n`;
  text += `Weight     : ${d.weight} kg\n`;
  text += `Height     : ${d.height} cm\n`;
  text += `Age/Gender : ${d.age} yrs, ${d.gender}\n`;
  text += `Activity   : ${actLabel(d.activity)}\n`;
  text += `Diet type  : ${d.diet_type === "non_veg" ? "Non-Veg" : "Veg"}\n\n`;
  text += `MACROS\n`;
  text += `  Protein: ${d.macros.protein}g\n`;
  text += `  Carbs  : ${d.macros.carbs}g\n`;
  text += `  Fat    : ${d.macros.fat}g\n\n`;
  text += `TODAY'S MEALS\n`;
  text += `  Breakfast : ${d.meal_plan.breakfast}\n`;
  text += `  Lunch     : ${d.meal_plan.lunch}\n`;
  text += `  Snacks    : ${d.meal_plan.snacks}\n`;
  text += `  Dinner    : ${d.meal_plan.dinner}\n`;
  downloadText("NutriBot_Diet_Plan.txt", text);
}

function downloadText(filename, text) {
  const blob = new Blob([text], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ═══════════════════════════════════════════════════════════════════════════════
// WELCOME & KEYBOARD
// ═══════════════════════════════════════════════════════════════════════════════
function injectWelcome() {
  addBubble("bot",
    `Hi! I'm <b>NutriBot</b> 🥗 — your AI diet assistant.<br><br>` +
    `Tell me your details for a personalised plan:<br>` +
    `<em>"I'm 25M, 75 kg, 175 cm, moderate activity, want to lose fat"</em><br><br>` +
    `Or use the quick buttons above to get started!`
  );
  showChips("greeting");
}

document.getElementById("input").addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});

// Init
injectWelcome();
</script>
