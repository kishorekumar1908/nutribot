services:
  backend:
    build: .
    container_name: nutribot-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
 
  frontend:
    image: nginx:alpine
    container_name: nutribot-frontend
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - backend
    restart: unless-stopped